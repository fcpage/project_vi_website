<!DOCTYPE html>
<html lang="en">

	<head>
		<title>Project VI - Request Access</title>
		<meta charset="UTF-8">
		<meta name="description" content="This is the request access page for our project" />
		<meta http-equiv="author" content="Fergus Page" />
		<meta name="robots" content="noindex nofollow" />
		<meta http-equiv="pragma" content="no-cache" />
		<link rel="stylesheet" href="../../css/project/general_style.css? v=1.1" type="text/css">
		<link rel="stylesheet" href="../../css/elevator/access_style.css? v=1.1" type="text/css">
	</head>

	<!--[if lt IE 9]>
	<script src=http://html5shiv.googlecode.com/svn/trunk/html5.js></script>
	<![endif]-->
	
	<body>
		<a href="../../../index.php">Home</a><br/>
		<h1>Request Access</h1>	<!-- the page you go to to request login credentials -->
		<form action="../../php/request_access.php" method="post" id="access">

			<fieldset>
				<legend>Contact</legend>	<!-- let's get some contact information -->

				<div>
					<label for="fn" class="text_label">First Name: </label><input id="fn" class="text_input" type="text" name="firstname" required /><br/><br/>	<!-- what is your name -->
					<label for="ln" class="text_label">Last Name: </label><input id="ln" class="text_input" type="text" name="lastname" required /><br/><br/>	<!-- what is your quest -->
					<label for="em" class="text_label">Email: </label><input id="em" class="text_input" type="text" name="email" required /><br/><br/>	<!-- what is the airspeed of an unladen swallow -->
					<label for="ws" class="text_label">Website: </label><input id="ws" class="text_input" type="text" name="url" /><br/><br/>	<!-- what is your favourite colour -->
				</div>

				<div id="rad">	<!-- what is your relation to the college -->
					<label><input type="radio" name="person" value="faculty" /> Faculty</label>
					<label><input type="radio" name="person" value="student" /> Student</label>
					<label><input type="radio" name="person" value="other" required /> Other</label>
				</div>
			</fieldset><br/>

			<fieldset>
				<legend>Involvement</legend>	<!-- what is your relation to the project -->

				<div id="I"><i><b>I...</b></i><br/></div>	<!-- choose a bunch -->
				<label><input type="checkbox" name="involvement[0]" value="none, " /> have no involvement in this project.</label><br/>
				<label><input type="checkbox" name="involvement[1]" value="instructor, " /> am an instructor in this project.</label><br/>
				<label><input type="checkbox" name="involvement[2]" value="instructor_other, " /> am another instructor.</label><br/>
				<label><input type="checkbox" name="involvement[3]" value="student, " /> am a student in this project.</label><br/>
				<label><input type="checkbox" name="involvement[4]" value="student_other, " /> am a student from another group.</label><br/>
				<label><input type="checkbox" name="involvement[5]" value="admin, " /> am a College administrator.</label><br/>
				<label><input type="checkbox" name="involvement[6]" value="external" /> am an external reviewer.</label><br/>
			</fieldset><br/>

			<fieldset>
				<legend>Details</legend>	<!-- be specific -->

				<p>Reason for request: 	<!-- what sort of action do we need to take -->
				<label><select id="question" name="reason" required>
					<option value="none" selected></option>
					<option value="new_user">Credential Initialisation</option>
					<option value="forgot_username">Forgot Username</option>
					<option value="forgot_password">Forgot Password</option>
					<option value="feedback">Leaving Feedback</option>
				</select></label>
				</p>

				<label class="text"><textarea class="text_input" name="details" id="details" placeholder="Give us some details..." required></textarea></label><br/><br/>	<!-- make your mark -->
				<label for="da">Response preferred by: </label><input id="da" type="date" name="deadline" /><br/>	<!-- when do you need to hear back by -->

				<p>How did we do?	<!-- please be kind -->
				<label for="feed"><select id="feed" name="good_job" required>
					<option value="ignored" selected></option>
					<option value="good">Good</option>
					<option value="really_good">Really Good</option>
					<option value="super_duper">Super Duper</option>
					<option value="excellent">Excellent</option>
				</select></label></p>

				<input id="submit" type="submit" value="Submit Request"/>	<!-- send it! -->
			</fieldset>
		</form><br/>
		<p id="copy" >Copyright &copy 2026 Fergus Page</p>
	</body>
</html>

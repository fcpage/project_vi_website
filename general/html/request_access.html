<!DOCTYPE html>
<html lang="en">

	<head>
		<title>Project VI - Request Access</title>
		<meta charset="UTF-8">
		<meta name="description" content="This is the request access page for our project" />
		<meta http-equiv="author" content="Fergus Page" />
		<meta name="robots" content="noindex nofollow" />
		<meta http-equiv="pragma" content="no-cache" />
		<link rel="stylesheet" href="../css/general_styles.css" type="text/css"
	</head>
	
	<body>
		<a href="../../index.html">Home</a><br/>
		<h1>Request Access</h1>
		
		<form action="../php/request_access.php" method="post" id="access">
			<fieldset>
				<legend>Contact</legend>
				First Name: <label><input type="text" name="firstname" required /></label><br/><br/>
				Last Name: <label><input type="text" name="lastname" required /></label><br/><br/>
				Email: <label><input type="text" name="email" required /></label><br/><br/>
				Website: <label><input type="text" name="url" /></label><br/><br/>
				
				<label><input type="radio" name="person" value="faculty" /> Faculty</label>
				<label><input type="radio" name="person" value="student" /> Student</label>
				<label><input type="radio" name="person" value="other" required /> Other</label>
			</fieldset>
				
			<fieldset>
				<legend>Involvement</legend>
				<i><b>I...</b></i><br/>
				<label><input type="checkbox" name="involvement" value="none" /> have no involvement in this project.</label><br/>
				<label><input type="checkbox" name="involvement" value="instructor" /> am an instructor in this project.</label><br/>
				<label><input type="checkbox" name="involvement" value="instructor_other" /> am another instructor.</label><br/>
				<label><input type="checkbox" name="involvement" value="student" /> am a student in this project.</label><br/>
				<label><input type="checkbox" name="involvement" value="student_other" /> am a student from another group.</label><br/>
				<label><input type="checkbox" name="involvement" value="admin" /> am a College administrator.</label><br/>
				<label><input type="checkbox" name="involvement" value="external" /> am an external reviewer.</label><br/>
			</fieldset>
			
			<fieldset>
				<legend>Details</legend>
				<p>Reason for request: 
				<label><select name="reason">
					<option value="none" selected></option>
					<option value="new_user">Credential Initialisation</option>
					<option value="forgot_username">Forgot Username</option>
					<option value="forgot_password">Forgot Password</option>
					<option value="feedback">Leaving Feedback</option>
				</select></label>
				</p>
				<label><textarea name="details" id="details" placeholder="Give us some details..." ></textarea></label><br/><br/>
				<label>Response preferred by: <input type="date" name="deadline" /></label><br/>
				
				<p>How did we do?
				<label><select name="good_job">
					<option value="ignored" selected></option>
					<option value="good">Good</option>
					<option value="really_good">Really Good</option>
					<option value="super_duper">Super Duper</option>
					<option value="excellent">Excellent</option>
				</select></label>
				</p>
				
				<input type="submit" value="Submit Request"/>
			</fieldset>	
			
		</form><br/>
		
		<a href="login.html">Back</a>
	</body>
</html>

<body>
<p id="verify"></p>
<div id="page" class="container">

    <header>
        <h1 id="#">Grant Access</h1>	<!-- the page you go tp to request login credentials -->
    </header>

    <nav>
        <fieldset id="bar1" class="sidebar">

        </fieldset><br/>
    </nav>

    <div id="content">
       <article>
           <section>
               <fieldset>
                   <legend>Grant Access to New Users?</legend>
                       <template id="grant-template">
                           <table>
                                <tbody>
                                    <tr>
                                        <th><b>Field</b></th>
                                        <th><b>Response</b></th>
                                    </tr>

                                    <tr>
                                        <td>Database Index:</td>
                                        <td class="index"></td>
                                    </tr>

                                    <tr>
                                        <td>Request Date:</td>
                                        <td class="date"></td>
                                    </tr>

                                    <tr>
                                        <td>Request Time:</td>
                                        <td class="time"></td>
                                    </tr>

                                    <tr>
                                        <td>First Name:</td>
                                        <td class="firstname"></td>
                                    </tr>

                                    <tr>
                                        <td>Last Name:</td>
                                        <td class="lastname"></td>
                                    </tr>

                                    <tr>
                                        <td>Email Address:</td>
                                        <td class="email"></td>
                                    </tr>

                                    <tr>
                                        <td>Relation:</td>
                                        <td class="person"></td>
                                    </tr>

                                    <tr>
                                        <td>Project Involvement:</td>
                                        <td class="involvement"></td>
                                    </tr>

                                    <tr>
                                        <td>Request Reason:</td>
                                        <td class="reason"></td>
                                    </tr>

                                    <tr>
                                        <td>Details:</td>
                                        <td class="details"></td>
                                    </tr>

                                    <tr>
                                        <td>Feedback:</td>
                                        <td class="good_job"></td>
                                    </tr>

                                    <tr>
                                        <td class="accept"><label id="accept">Accept</label></td>
                                        <td class="reject"><label id="reject">Reject</label></td>
                                    </tr>
                                </tbody>
                           </table>
                       </template>
                   <span id="grant0"></span>
                   <span id="grant1"></span>
                   <span id="grant2"></span>
               </fieldset>
           </section>
       </article>

        <footer>
            <p id="copy" >Copyright &copy <span id="year"></span> Fergus Page</p>
        </footer>

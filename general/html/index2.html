<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grid Layout</title>
  <meta http-equiv="author" content="Fergus Page" />
  <meta name="robots" content="noindex nofollow" />
  <meta http-equiv="pragma" content="no-cache" />
  <link rel="stylesheet" href="../css/960_12_col.css">
  <link rel="stylesheet" href="../css/style2.css">
</head>

<!--[if lt IE 9]>
<script src=http://html5shiv.googlecode.com/svn/trunk/html5.js></script>
<![endif]-->

<body>
  <div class="container_12 clearfix">
    <div id="header" class="grid_12">
      <h1>Logo</h1>
      <div id="nav">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Project</a></li>
          <li><a href="#">Plan</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </div>
    <div id="feature" class="grid_12"><p>Feature</p></div>
    <div class="article grid_4 alpha"><p>Column One</p></div>
    <div class="article grid_4"><p>Column Two</p></div>
    <div class="article grid_4 omega"><p>Column Three</p></div>
    <div id="footer"><p id="copy" >Copyright &copy 2026 Fergus Page</p></div>
  </div>
</body>
</html>
